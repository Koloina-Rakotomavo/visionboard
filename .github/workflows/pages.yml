name: Deploy cinema to GitHub Pages
# GitHub Pages source configured as GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: client
        run: npm install
      - name: Build cinema
        working-directory: client
        env:
          VITE_API_URL: https://visionboard-api-x1q2.onrender.com
        run: npm run build -- --base=/visionboard/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
